{% extends 'base.html' %}

{% block content %}
  <div class="card">
    <h2>Criar conta</h2>
    <form method="post">
      <label>Usuário</label>
      <input type="text" name="username" required>

      <label>Senha</label>
      <input type="password" name="password" required>

      <label>Confirmar senha</label>
      <input type="password" name="confirm_password" required>

      <button type="submit">Cadastrar</button>
    </form>
  </div>
{% endblock %}
